title: "ChipeSoft — Trabajo Práctico Integrador"
description: "Análisis y diseño de ChipeSoft, desarrollado para la dueña de Chiperia la Caraguateña."
lang: es

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter

relative_links:
  enabled: true
  collections: false

# Aplica la plantilla a todos los .md (incluidos los ejercitarios)
defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - CONTRIBUTING.md